name: Deploy Infrastructure

# Run this workflow once to provision all AWS infrastructure.
# Re-run it whenever you want to change instance sizes or add a custom domain.
#
# Required secrets (set in Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID        — IAM user access key (can be deleted after first run)
#   AWS_SECRET_ACCESS_KEY    — IAM user secret key
#   OPENAI_API_KEY           — OpenAI key (or ANTHROPIC_API_KEY, or both)
#   ANTHROPIC_API_KEY        — Anthropic key (optional if OPENAI_API_KEY is set)
#   DB_PASSWORD              — Password you choose for the database (letters + numbers only)
#   ADMIN_PANEL_PASSWORD     — Password you will use to log into the admin panel
#   GH_PAT                   — GitHub personal access token with secrets:write on this repo
#   DOMAIN_NAME              — Optional: your custom domain (e.g. chatbot.mylab.org)
#
# Optional workflow inputs (shown as a form when you click "Run workflow"):
#   eb_instance_type         — EC2 instance type (default: t3.small)
#   eb_max_instances         — Max number of app servers under load (default: 1)
#   db_instance_class        — Database instance class (default: db.t3.micro)

on:
  workflow_dispatch:
    inputs:
      eb_instance_type:
        description: 'App server EC2 instance type (e.g. t3.small, t3.medium)'
        required: false
        default: 't3.small'
        type: string
      eb_max_instances:
        description: 'Maximum number of app server instances'
        required: false
        default: '1'
        type: string
      db_instance_class:
        description: 'Database instance class (e.g. db.t3.micro, db.t3.small)'
        required: false
        default: 'db.t3.micro'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy AWS infrastructure
    runs-on: ubuntu-latest
    env:
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}

    steps:
      # ── 1. Fail fast before touching AWS if anything is missing ───────────────
      - name: Check required secrets
        env:
          OPENAI_KEY:           ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          ADMIN_PANEL_PASSWORD: ${{ secrets.ADMIN_PANEL_PASSWORD }}
          AWS_KEY:              ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET:           ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_PAT:               ${{ secrets.GH_PAT }}
        run: |
          fail=0
          missing() { echo "::error::$1 secret is not set"; fail=1; }

          [[ -z "$AWS_KEY" ]]             && missing "AWS_ACCESS_KEY_ID"
          [[ -z "$AWS_SECRET" ]]          && missing "AWS_SECRET_ACCESS_KEY"
          [[ -z "$DB_PASSWORD" ]]         && missing "DB_PASSWORD"
          [[ -z "$ADMIN_PANEL_PASSWORD" ]] && missing "ADMIN_PANEL_PASSWORD"
          [[ -z "$GH_PAT" ]]              && missing "GH_PAT"

          if [[ -z "$OPENAI_KEY" && -z "$ANTHROPIC_KEY" ]]; then
            echo "::error::At least one of OPENAI_API_KEY or ANTHROPIC_API_KEY must be set"
            fail=1
          fi

          [[ $fail -eq 1 ]] && exit 1

          # Validate GH_PAT has write access before touching AWS.
          # We do this by writing and immediately deleting a test secret.
          export GH_TOKEN="$GH_PAT"
          if ! gh secret set __PREFLIGHT_TEST__ --body "ok" --repo "${{ github.repository }}" 2>/dev/null; then
            echo "::error::GH_PAT cannot write repository secrets on ${{ github.repository }}."
            echo "::error::Re-generate it as a classic token with the full 'repo' scope checked (not just public_repo)."
            exit 1
          fi
          gh secret delete __PREFLIGHT_TEST__ --repo "${{ github.repository }}" 2>/dev/null || true

          echo "All required secrets are present and valid."

      # ── 2. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 3. Terraform ──────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'
          terraform_wrapper: false

      # ── 4. AWS credentials (long-lived IAM user key for this bootstrap step) ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ── 5. Create the S3 state bucket (idempotent) ───────────────────────────
      # Uses a deterministic name based on the AWS account ID — no random suffix,
      # no secret needed to remember the name. Safe to run on every deploy.
      - name: Bootstrap Terraform state backend
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="humanlike-chatbot-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $BUCKET"
          else
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "State bucket created: $BUCKET"
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      # ── 6. Point Terraform at the remote state bucket ─────────────────────────
      - name: Initialise Terraform
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=humanlike-chatbot/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -input=false

      # ── 7. Reconcile state ───────────────────────────────────────────────────
      # If a previous run failed and the rollback was incomplete, AWS resources
      # may exist that are not in the current Terraform state. We import them
      # here so `terraform apply` updates them instead of failing with
      # "AlreadyExists". Each import is a no-op if the resource is already in
      # state or does not exist in AWS.
      - name: Reconcile state — import any orphaned resources
        working-directory: infra/terraform
        env:
          TF_VAR_environment:                 production
          TF_VAR_github_org:                  ${{ github.repository_owner }}
          TF_VAR_github_repo:                 ${{ github.event.repository.name }}
          TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_VAR_eb_instance_type:            ${{ inputs.eb_instance_type }}
          TF_VAR_eb_max_instances:            ${{ inputs.eb_max_instances }}
          TF_VAR_db_instance_class:           ${{ inputs.db_instance_class }}
          TF_VAR_domain_name:                 ${{ secrets.DOMAIN_NAME }}
          TF_VAR_create_github_oidc_provider: ${{ secrets.CREATE_GITHUB_OIDC_PROVIDER || 'true' }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          P="humanlike-chatbot-production"

          # Import a resource only if it exists in AWS but not in Terraform state.
          try_import() {
            local addr="$1" id="$2"
            if terraform state show "$addr" &>/dev/null; then
              return 0
            fi
            terraform import -input=false "$addr" "$id" 2>/dev/null \
              && echo "  imported: $addr" || true
          }

          # RDS — always try to import the parameter group and subnet group (they
          # outlive the instance and are cheap to check). For the instance itself,
          # wait if it is still being deleted from a previous rollback.
          try_import aws_db_parameter_group.mariadb "${P}-mariadb"
          try_import aws_db_subnet_group.database   "${P}-database-subnet-group"
          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "${P}-database" \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null \
            || echo "not-found")
          if [[ "$RDS_STATUS" == "deleting" ]]; then
            echo "Previous RDS instance is still being deleted — waiting (up to 30 min)..."
            aws rds wait db-instance-deleted --db-instance-identifier "${P}-database" || true
          elif [[ "$RDS_STATUS" == "available" ]]; then
            try_import aws_db_instance.main "${P}-database"
          fi

          # ElastiCache
          try_import aws_elasticache_serverless_cache.redis "${P}-redis"

          # S3
          try_import aws_s3_bucket.frontend_assets  "${P}-frontend-${ACCOUNT_ID}"
          try_import aws_s3_bucket.application_data "${P}-data-${ACCOUNT_ID}"

          # IAM roles and instance profile
          try_import aws_iam_role.eb_instance_role          "${P}-eb-instance-role"
          try_import aws_iam_role.eb_service_role           "${P}-eb-service-role"
          try_import aws_iam_role.github_actions_deployment "${P}-github-actions"
          try_import aws_iam_instance_profile.eb_instance_profile "${P}-eb-instance-profile"

          # GitHub OIDC provider — import if it already exists and we would try to
          # create it (create_github_oidc_provider = true), preventing a duplicate error.
          if [[ "${TF_VAR_create_github_oidc_provider:-true}" == "true" ]]; then
            OIDC_ARN="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
            if aws iam get-open-id-connect-provider \
                --open-id-connect-provider-arn "$OIDC_ARN" &>/dev/null; then
              try_import "aws_iam_openid_connect_provider.github_actions[0]" "$OIDC_ARN"
            fi
          fi

          # Elastic Beanstalk application and environment
          try_import aws_elastic_beanstalk_application.chatbot_api "${P}"
          EB_ENV_ID=$(aws elasticbeanstalk describe-environments \
            --application-name "${P}" \
            --environment-names "${P}-env" \
            --query 'Environments[?Status!=`Terminated`].EnvironmentId | [0]' \
            --output text 2>/dev/null || true)
          if [[ -n "$EB_ENV_ID" && "$EB_ENV_ID" != "None" ]]; then
            try_import aws_elastic_beanstalk_environment.chatbot_api "$EB_ENV_ID"
          fi

          # CloudFront OAC (ID is not the name; look it up first)
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${P}-frontend-oac'].Id | [0]" \
            --output text 2>/dev/null || true)
          if [[ -n "$OAC_ID" && "$OAC_ID" != "None" ]]; then
            try_import aws_cloudfront_origin_access_control.frontend_assets "$OAC_ID"
          fi

      # ── 8. Custom domain: create the ACM cert first so we can print the     ───
      #       DNS validation record before the full apply waits for it          ───
      - name: Create ACM certificate
        if: env.DOMAIN_NAME != ''
        working-directory: infra/terraform
        env:
          TF_VAR_environment:                 production
          TF_VAR_github_org:                  ${{ github.repository_owner }}
          TF_VAR_github_repo:                 ${{ github.event.repository.name }}
          TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_VAR_eb_instance_type:            ${{ inputs.eb_instance_type }}
          TF_VAR_eb_max_instances:            ${{ inputs.eb_max_instances }}
          TF_VAR_db_instance_class:           ${{ inputs.db_instance_class }}
          TF_VAR_domain_name:                 ${{ secrets.DOMAIN_NAME }}
          TF_VAR_create_github_oidc_provider: ${{ secrets.CREATE_GITHUB_OIDC_PROVIDER || 'true' }}
        run: |
          terraform apply \
            -target='aws_acm_certificate.custom_domain[0]' \
            -auto-approve \
            -input=false

      # ── 9. Print the DNS validation record to the summary so the researcher ───
      #       can add it while the rest of the infrastructure is building       ───
      - name: Print DNS validation record
        if: env.DOMAIN_NAME != ''
        working-directory: infra/terraform
        run: |
          CNAME_NAME=$(terraform output -raw acm_validation_cname_name)
          CNAME_VALUE=$(terraform output -raw acm_validation_cname_value)
          {
            echo "## Action required: add this DNS record now"
            echo ""
            echo "Add the following record at your domain registrar **while this workflow continues running**."
            echo "This proves you own the domain and enables HTTPS for your custom URL."
            echo ""
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| CNAME | \`$CNAME_NAME\` | \`$CNAME_VALUE\` |"
            echo ""
            echo "> The workflow will wait up to 30 minutes for DNS to propagate."
            echo "> If it times out before you add the record, just re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 9. Apply all infrastructure ───────────────────────────────────────────
      - name: Apply infrastructure
        working-directory: infra/terraform
        env:
          TF_VAR_environment:                 production
          TF_VAR_github_org:                  ${{ github.repository_owner }}
          TF_VAR_github_repo:                 ${{ github.event.repository.name }}
          TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_VAR_eb_instance_type:            ${{ inputs.eb_instance_type }}
          TF_VAR_eb_max_instances:            ${{ inputs.eb_max_instances }}
          TF_VAR_db_instance_class:           ${{ inputs.db_instance_class }}
          TF_VAR_domain_name:                 ${{ secrets.DOMAIN_NAME }}
          TF_VAR_create_github_oidc_provider: ${{ secrets.CREATE_GITHUB_OIDC_PROVIDER || 'true' }}
        run: |
          terraform apply -auto-approve -input=false

      # ── 10. Write all secrets needed by staging.yml / production.yml ──────────
      - name: Write deployment secrets
        working-directory: infra/terraform
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REPO="${{ github.repository }}"
          set_secret() { gh secret set "$1" --body "$2" --repo "$REPO"; }

          set_secret AWS_ACCOUNT_ID                     "$(terraform output -raw github_secret_AWS_ACCOUNT_ID)"
          set_secret AWS_ROLE_NAME                      "$(terraform output -raw github_secret_AWS_ROLE_NAME)"
          set_secret AWS_S3_BUCKET_NAME_FRONTEND        "$(terraform output -raw github_secret_AWS_S3_BUCKET_NAME_FRONTEND)"
          set_secret AWS_S3_PROD_BUCKET_NAME_FRONTEND   "$(terraform output -raw github_secret_AWS_S3_BUCKET_NAME_FRONTEND)"
          set_secret AWS_CLOUDFRONT_DISTRIBUTION_ID     "$(terraform output -raw github_secret_AWS_CLOUDFRONT_DISTRIBUTION_ID)"
          set_secret AWS_PROD_CLOUDFRONT_DISTRIBUTION_ID "$(terraform output -raw github_secret_AWS_PROD_CLOUDFRONT_DISTRIBUTION_ID)"
          set_secret AWS_BACKEND_APPLICATION_NAME       "$(terraform output -raw github_secret_AWS_BACKEND_APPLICATION_NAME)"
          set_secret AWS_BACKEND_ENVIRONMENT_NAME       "$(terraform output -raw github_secret_AWS_BACKEND_ENVIRONMENT_NAME)"
          set_secret AWS_PROD_BACKEND_ENVIRONMENT_NAME  "$(terraform output -raw github_secret_AWS_PROD_BACKEND_ENVIRONMENT_NAME)"
          set_secret VITE_API_URL                       "$(terraform output -raw frontend_url)/api"

      # ── 11. Rollback on failure ───────────────────────────────────────────────
      # Runs only when a previous step failed. Destroys everything Terraform
      # managed to create so no half-built resources are left running.
      # The bootstrap S3 state bucket is NOT destroyed — it is managed by a
      # separate config and will be reused on the next attempt.
      - name: Rollback on failure
        if: failure()
        working-directory: infra/terraform
        env:
          TF_VAR_environment:                 production
          TF_VAR_github_org:                  ${{ github.repository_owner }}
          TF_VAR_github_repo:                 ${{ github.event.repository.name }}
          TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_VAR_eb_instance_type:            ${{ inputs.eb_instance_type }}
          TF_VAR_eb_max_instances:            ${{ inputs.eb_max_instances }}
          TF_VAR_db_instance_class:           ${{ inputs.db_instance_class }}
          TF_VAR_domain_name:                 ${{ secrets.DOMAIN_NAME }}
          TF_VAR_create_github_oidc_provider: ${{ secrets.CREATE_GITHUB_OIDC_PROVIDER || 'true' }}
        run: |
          if [[ ! -d .terraform ]]; then
            echo "Terraform was not initialised — nothing to roll back."
            exit 0
          fi
          echo "Rolling back — destroying all resources created during this run..."
          terraform destroy -auto-approve -input=false \
            || echo "::warning::Destroy encountered errors. Some resources may need manual cleanup in the AWS console."

      # ── 12. Summary ───────────────────────────────────────────────────────────
      - name: Write summary
        working-directory: infra/terraform
        run: |
          FRONTEND_URL=$(terraform output -raw frontend_url)
          DOMAIN="$DOMAIN_NAME"

          {
            echo "## Deployment complete"
            echo ""
            echo "| | URL |"
            echo "|---|---|"
            echo "| Chatbot | $FRONTEND_URL |"
            echo "| Admin panel | $FRONTEND_URL/api/admin/ |"
            echo ""
            echo "Log in to the admin panel with username \`admin\` and the password you set as \`ADMIN_PANEL_PASSWORD\`."
            echo ""
            echo "**Next step:** push to the \`main\` branch to deploy the application code."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$DOMAIN" ]]; then
            CF_DOMAIN=$(terraform output -raw cloudfront_domain_name)
            {
              echo ""
              echo "## Custom domain: final DNS record"
              echo ""
              echo "After adding the validation record above and re-running this workflow, add this record to serve your chatbot at **https://$DOMAIN**:"
              echo ""
              echo "| Type | Name | Value |"
              echo "|---|---|---|"
              echo "| CNAME | \`$DOMAIN\` | \`$CF_DOMAIN\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
