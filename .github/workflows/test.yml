name: Test Suite

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev build-essential

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        cd generic_chatbot
        pipenv install --dev --deploy

    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
        echo "DATABASE_ENGINE=django.db.backends.mysql" >> $GITHUB_ENV
        echo "DATABASE_NAME=test_db" >> $GITHUB_ENV
        echo "DATABASE_USER=root" >> $GITHUB_ENV
        echo "DATABASE_PASSWORD=" >> $GITHUB_ENV
        echo "DATABASE_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DATABASE_PORT=3306" >> $GITHUB_ENV
        echo "CORS_ALLOW_ALL_ORIGINS=True" >> $GITHUB_ENV
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test-openai-key" >> $GITHUB_ENV
        echo "ANTHROPIC_API_KEY=test-anthropic-key" >> $GITHUB_ENV
        echo "AWS_BUCKET_NAME=test-bucket" >> $GITHUB_ENV
        echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
        echo "AWS_ACCESS_KEY_ID=test-access-key" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=test-secret-key" >> $GITHUB_ENV
        echo "BACKEND_ENVIRONMENT=test" >> $GITHUB_ENV

    - name: Wait for database
      run: |
        cd generic_chatbot
        pipenv run python -c "
        import time
        import mysql.connector
        from mysql.connector import Error
        
        max_attempts = 30
        attempt = 0
        
        while attempt < max_attempts:
            try:
                connection = mysql.connector.connect(
                    host='127.0.0.1',
                    port=3306,
                    user='root',
                    password='',
                    database='test_db'
                )
                if connection.is_connected():
                    print('Database connection successful')
                    connection.close()
                    break
            except Error as e:
                print(f'Attempt {attempt + 1}: {e}')
                attempt += 1
                time.sleep(2)
        
        if attempt >= max_attempts:
            print('Failed to connect to database')
            exit(1)
        "

    - name: Run database migrations
      run: |
        cd generic_chatbot
        pipenv run python manage.py migrate

    - name: Run linting
      run: |
        cd generic_chatbot
        pipenv run ruff check .

    - name: Run tests
      run: |
        cd generic_chatbot
        pipenv run python -m pytest --cov=chatbot --cov=server --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./generic_chatbot/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          generic_chatbot/htmlcov/
          generic_chatbot/.coverage
          generic_chatbot/coverage.xml
