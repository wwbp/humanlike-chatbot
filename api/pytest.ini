[pytest]
DJANGO_SETTINGS_MODULE = generic_chatbot.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not integration"
markers =
    integration: live API calls (needs real keys; skipped in CI by default)
testpaths = chatbot/tests
