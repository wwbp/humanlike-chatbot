name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: "generic_chatbot.settings"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        django-version: [4.2]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev build-essential

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev --deploy

    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
        echo "DATABASE_ENGINE=django.db.backends.mysql" >> $GITHUB_ENV
        echo "DATABASE_NAME=test_db" >> $GITHUB_ENV
        echo "DATABASE_USER=root" >> $GITHUB_ENV
        echo "DATABASE_PASSWORD=" >> $GITHUB_ENV
        echo "DATABASE_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DATABASE_PORT=3306" >> $GITHUB_ENV
        echo "CORS_ALLOW_ALL_ORIGINS=True" >> $GITHUB_ENV
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test-openai-key" >> $GITHUB_ENV
        echo "ANTHROPIC_API_KEY=test-anthropic-key" >> $GITHUB_ENV
        echo "AWS_BUCKET_NAME=test-bucket" >> $GITHUB_ENV
        echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
        echo "AWS_ACCESS_KEY_ID=test-access-key" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=test-secret-key" >> $GITHUB_ENV
        echo "BACKEND_ENVIRONMENT=test" >> $GITHUB_ENV

    - name: Wait for database
      run: |
        pipenv run python -c "
        import time
        import mysql.connector
        from mysql.connector import Error
        
        max_attempts = 30
        attempt = 0
        
        while attempt < max_attempts:
            try:
                connection = mysql.connector.connect(
                    host='127.0.0.1',
                    port=3306,
                    user='root',
                    password='',
                    database='test_db'
                )
                if connection.is_connected():
                    print('Database connection successful')
                    connection.close()
                    break
            except Error as e:
                print(f'Attempt {attempt + 1}: {e}')
                attempt += 1
                time.sleep(2)
        
        if attempt >= max_attempts:
            print('Failed to connect to database')
            exit(1)
        "

    - name: Run database migrations
      run: |
        pipenv run python manage.py migrate

    - name: Run linting
      run: |
        pipenv run make lint

    - name: Run unit tests
      run: |
        pipenv run make test-unit
      env:
        DJANGO_SETTINGS_MODULE: generic_chatbot.settings

    - name: Run integration tests
      run: |
        pipenv run make test-integration
      env:
        DJANGO_SETTINGS_MODULE: generic_chatbot.settings

    - name: Run tests with coverage
      run: |
        pipenv run make test-coverage
      env:
        DJANGO_SETTINGS_MODULE: generic_chatbot.settings

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage badge
      run: |
        pipenv run coverage-badge -o coverage-badge.svg

    - name: Upload coverage badge
      uses: actions/upload-artifact@v3
      with:
        name: coverage-badge
        path: coverage-badge.svg

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          htmlcov/
          .coverage
          test-results.xml

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run security checks
      run: |
        bandit -r chatbot/ server/ -f json -o bandit-report.json || true
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  docker-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and test with Docker
      run: |
        # Build the image
        docker build -f Dockerfile.local -t chatbot-test .
        
        # Run tests in container
        docker run --rm chatbot-test pytest -m "unit or integration" --cov=chatbot --cov=server --cov-report=term-missing

  notify:
    runs-on: ubuntu-latest
    needs: [test, security, docker-test]
    if: always()
    
    steps:
    - name: Notify on failure
      if: failure()
      run: |
        echo "Tests failed! Check the logs above for details."
        # Add notification logic here (Slack, email, etc.)
